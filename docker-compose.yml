services:
  sql:
    # 2025+ required: the Components.Information column uses the native json type.
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BikeBuilder!Dev2026"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  servicebus-sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BikeBuilder!Bus2026"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "BikeBuilder!Bus2026"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./Tools/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      # The .NET Cosmos SDK does not support the vnext emulator's default http mode.
      PROTOCOL: "https"
      ENABLE_EXPLORER: "false"
    ports:
      - "8081:8081"
      - "8082:8080" # health probe: curl http://localhost:8082/ready
    volumes:
      - cosmos-data:/data

  keyvault-emulator:
    image: jamesgoulddev/azure-keyvault-emulator:latest
    ports:
      - "4997:4997"
    volumes:
      - ./Tools/keyvault-emulator/certs:/certs
    environment:
      Persist: "true"

  jaeger:
    # v2 all-in-one with in-memory storage - traces reset with the container, fine for dev.
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI: http://localhost:16686
      - "4317:4317"   # OTLP gRPC (the .NET OTLP exporter default endpoint)
      - "4318:4318"   # OTLP HTTP

volumes:
  sql-data:
  azurite-data:
  cosmos-data:
