server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A bare "types {}" block here would replace (not merge with) nginx's default
    # mime.types map, so index.html etc. would fall back to application/octet-stream.
    # Scope the wasm mapping to just .wasm files instead.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
