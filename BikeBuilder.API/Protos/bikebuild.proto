syntax = "proto3";

option csharp_namespace = "BikeBuilder.API.Protos";

package bikebuilder;

import "google/protobuf/timestamp.proto";

service BikeBuildService {
  rpc ListBikeBuilds (ListBikeBuildsRequest) returns (ListBikeBuildsResponse);
  rpc GetBikeBuild (GetBikeBuildRequest) returns (BikeBuildMessage);
  rpc CreateBikeBuild (CreateBikeBuildRequest) returns (BikeBuildMessage);
  rpc UpdateBikeBuild (UpdateBikeBuildRequest) returns (BikeBuildMessage);
  rpc DeleteBikeBuild (DeleteBikeBuildRequest) returns (DeleteBikeBuildResponse);

  rpc AddBikeBuildComponent (AddBikeBuildComponentRequest) returns (BikeBuildComponentMessage);
  rpc UpdateBikeBuildComponent (UpdateBikeBuildComponentRequest) returns (BikeBuildComponentMessage);
  rpc RemoveBikeBuildComponent (RemoveBikeBuildComponentRequest) returns (RemoveBikeBuildComponentResponse);
}

message BikeBuildMessage {
  int32 id = 1;
  string name = 2;
  google.protobuf.Timestamp date = 3;
  string description = 4;
  repeated BikeBuildComponentMessage components = 5;
  string total = 6;
}

message BikeBuildComponentMessage {
  int32 id = 1;
  int32 bike_build_id = 2;
  int32 component_id = 3;
  string component_name = 4;
  int32 quantity = 5;
  google.protobuf.Timestamp date = 6;
}

message ListBikeBuildsRequest {
}

message ListBikeBuildsResponse {
  repeated BikeBuildMessage bike_builds = 1;
}

message GetBikeBuildRequest {
  int32 id = 1;
}

message CreateBikeBuildRequest {
  string name = 1;
  google.protobuf.Timestamp date = 2;
  string description = 3;
}

message UpdateBikeBuildRequest {
  int32 id = 1;
  string name = 2;
  google.protobuf.Timestamp date = 3;
  string description = 4;
}

message DeleteBikeBuildRequest {
  int32 id = 1;
}

message DeleteBikeBuildResponse {
  bool success = 1;
}

message AddBikeBuildComponentRequest {
  int32 bike_build_id = 1;
  int32 component_id = 2;
  int32 quantity = 3;
  google.protobuf.Timestamp date = 4;
}

message UpdateBikeBuildComponentRequest {
  int32 id = 1;
  int32 component_id = 2;
  int32 quantity = 3;
  google.protobuf.Timestamp date = 4;
}

message RemoveBikeBuildComponentRequest {
  int32 id = 1;
}

message RemoveBikeBuildComponentResponse {
  bool success = 1;
}
